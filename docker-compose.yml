services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize test database on first startup
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    container_name: api
    command:
      - sh
      - -c
      - |
        echo "Waiting for workspace..."
        while [ ! -f /workspace/package.json ]; do sleep 2; done
        echo "Workspace found! Installing dependencies..."
        cd /workspace && (pnpm install --no-frozen-lockfile || pnpm install)
        echo "Generating Prisma client..."
        cd packages/db && pnpm prisma generate
        if [ ! -d node_modules/.prisma/client ] && [ ! -f node_modules/@prisma/client/index.js ]; then
          echo "ERROR: Prisma client not found after generation!"
          exit 1
        fi
        echo "Prisma client generated successfully!"
        echo "Cleaning up empty migration directories..."
        find prisma/migrations -type d -mindepth 1 -maxdepth 1 -empty -exec rm -rf {} \; 2>/dev/null || true
        echo "Applying database migrations..."
        pnpm prisma migrate deploy || echo "WARNING: Migration deploy failed, continuing anyway (database may already be up to date)"
        echo "Starting API server..."
        cd /workspace/apps/api && exec pnpm dev
    restart: unless-stopped
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/packages/config/node_modules
      - /workspace/packages/db/node_modules
      - /workspace/packages/lib/node_modules
      - /workspace/packages/ui/node_modules
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
    networks:
      - appnet
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3001/health", "-O", "-"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: ./apps/web
    container_name: web
    command:
      - sh
      - -c
      - |
        echo "Waiting for workspace..."
        while [ ! -f /workspace/package.json ]; do sleep 2; done
        echo "Workspace found! Installing dependencies..."
        cd /workspace && (pnpm install --no-frozen-lockfile || pnpm install)
        echo "Dependencies installed! Starting Next.js..."
        cd apps/web && exec pnpm dev
    restart: unless-stopped
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/packages/config/node_modules
      - /workspace/packages/db/node_modules
      - /workspace/packages/lib/node_modules
      - /workspace/packages/ui/node_modules
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_API_URL is only used for SSR - client-side uses dynamic hostname
      NEXT_PUBLIC_API_URL: http://localhost:3001
    networks:
      - appnet
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000", "-O", "-"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:

networks:
  appnet:
